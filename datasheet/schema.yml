schema_version: "1.0"
device:
  name: "M5Stack Unit PaHub v2.0"
  sku: "U040-B"
  scope: "Six-port board using a PCA9548AP-compatible eight-channel I2C switch"

source_evidence:
  verified_on: "2026-08-01"
  official_product_page: "https://docs.m5stack.com/en/unit/pahub2"
  board_reference_image: "https://static-cdn.m5stack.com/resource/docs/products/unit/pahub2/pahub2_06.webp"
  chip_datasheet:
    file: "pca9548a.pdf"
    document: "ZHCSJK4G, TI Simplified Chinese translation of English SCPS143G"
    revision: "Texas Instruments PCA9548A revision G, March 2021"
    pages: 42
    sha256: "fb203781fbac2d5de118ad64b15f6a6a7c93eb1121a2d00af3e6daa7f555d5b7"
    official_url: "https://www.ti.com/product/PCA9548A"
    reviewed_on: "2026-09-26"
    language_note: "Sections 1-3 are Chinese; technical sections 5-13 are English. TI states the English SCPS143 data sheet prevails."
  precedence:
    - "Use the product page and board imagery for the six exposed ports, fitted PCA9548AP, and default address."
    - "Use the TI datasheet for the control byte, STOP activation, electrical limits, and timing."
    - "Use Figure 8-7 for reads; the 8.6.3.2 prose describes an unrelated command/restart sequence."
    - "POR thresholds differ between section 6.5 and Table 10-1; design to the wider envelope of both."

chip:
  part: "PCA9548A"
  function: "8-channel bidirectional translating I2C/SMBus switch"
  channels: 8
  address_7bit_range: [0x70, 0x77]
  address_format: "1110 A2 A1 A0 (Figure 8-4, Table 8-1)"
  supply_v: { min: 2.3, max: 5.5 }
  i2c_clock_khz: { min: 0, max: 400 }
  bus_capacitance_pf_max: 400
  operating_temp_c: { min: -40, max: 85 }
  inputs_5v_tolerant: true
  interrupts: false
  control_register:
    width_bits: 8
    access: "read/write, no sub-address"
    reset_value: 0x00
    bit_n: "1 enables channel n; any combination allowed"
    activation: "after the STOP that follows the write"
    multi_byte_write: "last byte received is stored"
    read: "START, addr|R, control byte, master NACK, STOP"
  reset_pin:
    polarity: "active low; pull-up to VCC required when not driven"
    t_w_low_ns_min: 6
    t_rec_sta_ns_min: 0
    t_rst_sda_clear_ns_max: 500
    errata: "RESET voltage must not exceed VCC"
  power_on_reset:
    effect: "all channels deselected; registers and I2C state machine initialized"
    vporr_v: { table_6_5_typ: 1.2, table_6_5_max: 1.5, table_10_1_min: 1.033, table_10_1_max: 1.428 }
    vporf_v: { table_6_5_min: 0.8, table_6_5_typ: 1.0, table_10_1_min: 0.767, table_10_1_max: 1.144 }
    vcc_fall_ms: { min: 1, max: 100 }
    vcc_rise_ms: { min: 0.01, max: 100 }
    time_to_re_ramp_ms_min: 0.001
  r_on_ohm:
    vcc_4v5_5v5: { min: 4, typ: 10, max: 20 }
    vcc_3v0_3v6: { min: 5, typ: 12, max: 30 }
    vcc_2v3_2v7: { min: 7, typ: 15, max: 45 }

interface:
  type: "I2C"
  default_address_7bit: 0x70
  project_address_7bit: 0x72
  valid_board_channels: [0, 1, 2, 3, 4, 5]
  valid_board_mask: 0x3F
  control_register: "implicit one-byte channel mask"
  reset_line_exposed: false
